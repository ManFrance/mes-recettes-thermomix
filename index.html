<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Recettes Thermomix</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #667eea;
            text-align: center;
        }
        .recettes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .recette-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .recette-card:hover {
            transform: translateY(-5px);
        }
        .recette-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .recette-card h3 {
            padding: 15px;
            margin: 0;
        }
        .recette-card p {
            padding: 0 15px 15px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>🍳 Mon Catalogue de Recettes Thermomix</h1>
    <div class="recettes-grid" id="recettes-list">
        <p>Vos recettes apparaîtront ici...</p>
    </div>
</body>
</html>
